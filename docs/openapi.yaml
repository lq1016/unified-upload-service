openapi: 3.0.3
info:
  title: 统一文件上传与图片处理服务 API
  version: 1.0.0
  description: |
    一套统一的文件上传与图片处理服务。
    - 9+ 接口：直传凭证、小文件上传、分片上传、合并、删除、图片处理、访问鉴权等
    - 2GB 分片上传与断点续传
    - 类型白名单 / 大小限制 / 恶意文件魔数校验 / 私有桶签名访问
    - 图片压缩率与画质可配、水印位置可配、处理结果缓存
  contact:
    name: InteMatrix 社区
servers:
  - url: http://localhost:3000
    description: 本地开发环境
tags:
  - name: 认证
  - name: 上传
  - name: 文件管理
  - name: 图片处理
  - name: 访问鉴权
  - name: 审计
paths:
  /api/auth/login:
    post:
      tags: [认证]
      summary: 登录（获取 JWT）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: user1 }
                password: { type: string, example: Test@123456 }
      responses:
        '200':
          description: 登录成功，返回 token
        '401':
          description: 账号或密码错误
  /api/health:
    get:
      tags: [认证]
      summary: 健康检查
      responses:
        '200': { description: OK }
  /api/upload/direct-credentials:
    post:
      tags: [上传]
      summary: 接口1 - 获取直传凭证（S3 预签名 PUT / local 直传 URL）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originalName, mimeType, size]
              properties:
                originalName: { type: string, example: photo.png }
                mimeType: { type: string, example: image/png }
                size: { type: integer, example: 10485760 }
      responses:
        '200': { description: 返回 uploadUrl / fileId / objectKey }
        '400': { description: 类型或参数不合法 }
  /api/upload/small:
    post:
      tags: [上传]
      summary: 接口2 - 小文件上传（multipart/form-data，字段 file）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: 上传成功，返回文件元数据 }
        '400': { description: 类型/魔数/黑名单校验失败 }
        '413': { description: 超过大小限制 }
  /api/upload/multipart/init:
    post:
      tags: [上传]
      summary: 接口3 - 初始化分片上传
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originalName, mimeType, size]
              properties:
                originalName: { type: string }
                mimeType: { type: string }
                size: { type: integer, description: 文件总字节数，最大 2GB }
                chunkSize: { type: integer, description: 分片大小，默认 5MB }
      responses:
        '200': { description: 返回 uploadId / fileId / totalChunks }
  /api/upload/multipart/{uploadId}/chunk/{index}:
    put:
      tags: [上传]
      summary: 接口4 - 上传单个分片（multipart/form-data，字段 chunk）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: uploadId, required: true, schema: { type: string } }
        - { in: path, name: index, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                chunk: { type: string, format: binary }
      responses:
        '200': { description: 分片已保存，返回已上传分片索引列表 }
  /api/upload/multipart/{uploadId}/status:
    get:
      tags: [上传]
      summary: 断点续传状态查询（返回已上传分片）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: uploadId, required: true, schema: { type: string } }
      responses:
        '200': { description: 上传会话状态 }
  /api/upload/multipart/{uploadId}/merge:
    post:
      tags: [上传]
      summary: 接口5 - 合并分片（校验完整性后拼接，计算 sha256）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: uploadId, required: true, schema: { type: string } }
      responses:
        '200': { description: 合并成功 }
        '409': { description: 分片不完整 }
  /api/files/{id}:
    delete:
      tags: [文件管理]
      summary: 接口6 - 删除文件（软删除 + 删除物理对象 + 审计）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: 删除成功 }
  /api/images/process:
    post:
      tags: [图片处理]
      summary: 接口7 - 图片压缩/画质/水印处理（结果缓存）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId: { type: string }
                width: { type: integer }
                height: { type: integer }
                quality: { type: integer, minimum: 1, maximum: 100, description: 画质，默认 80 }
                format: { type: string, enum: [webp, jpeg, png] }
                compressionRatio: { type: number, minimum: 0.1, maximum: 1 }
                watermark: { type: boolean }
                watermarkText: { type: string }
                watermarkPosition: { type: string, enum: [top-left, top-right, bottom-left, bottom-right, center] }
                watermarkOpacity: { type: number, minimum: 0, maximum: 1 }
      responses:
        '200': { description: 处理结果（base64 / 指标） }
        '400': { description: 非图片文件 }
  /api/access/sign:
    post:
      tags: [访问鉴权]
      summary: 接口8 - 生成私有访问签名 URL（默认 5 分钟有效）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId: { type: string }
                ttl: { type: integer, minimum: 1, maximum: 3600 }
      responses:
        '200': { description: 返回签名 URL 与过期时间 }
  /api/access/file:
    get:
      tags: [访问鉴权]
      summary: 接口9 - 使用签名 URL 访问私有文件
      parameters:
        - { in: query, name: fileId, required: true, schema: { type: string } }
        - { in: query, name: token, required: true, schema: { type: string } }
      responses:
        '200': { description: 文件内容 }
        '403': { description: 签名无效或过期 }
  /api/access/logs:
    get:
      tags: [审计]
      summary: 访问记录查询
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 最近 100 条访问日志 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
